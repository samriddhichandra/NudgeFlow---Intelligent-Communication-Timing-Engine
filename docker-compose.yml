services:
  db:
    image: postgres:16-alpine
    container_name: ict_engine_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ict_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ict_password}
      POSTGRES_DB: ${POSTGRES_DB:-ict_engine}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ict_user} -d ${POSTGRES_DB:-ict_engine}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: ict_engine_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-ict_user}:${POSTGRES_PASSWORD:-ict_password}@db:5432/${POSTGRES_DB:-ict_engine}
      APP_ENV: development
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app

  frontend:
    build:
      context: ./frontend
    container_name: ict_engine_frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata:
